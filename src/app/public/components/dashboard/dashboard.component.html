<mat-drawer-container class="dash-container" hasBackdrop="false">

    <mat-drawer #sideNav class="side-nav" mode="side" opened="true" position="start">
        <mii-sidenav></mii-sidenav>
        <mat-toolbar class="sidenav-footer">
            <button mat-raised-button color="accent" (click)="testChat.toggle()">Probar chat</button>
        </mat-toolbar>
    </mat-drawer>

    <mat-drawer #testChat class="test-chat" mode="over" position="end">
        Test-chat
    </mat-drawer>

    <mat-drawer-content>
        <router-outlet></router-outlet>
    </mat-drawer-content>
</mat-drawer-container>
