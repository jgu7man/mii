<mat-card>
    <mat-card-title>
        Crear agente nuevo
    </mat-card-title>
    <mat-card-content>
        <form action="#" method="post" onsubmit="return false">
            <div class="row">
                <div class="col s12">

                </div>

                <!-- Nombre -->
                <div class="col s12">
                    <mat-form-field>
                        <mat-label>Nombre</mat-label>
                        <input name="nombre" id="nombre" matInput>
                    </mat-form-field>
                </div>

                <!-- select de lenguajes -->
                <div class="col s6">
                    <mat-form-field>
                        <mat-label>Lenguaje</mat-label>
                        <mat-select>
                            <mat-option></mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <!-- Zona horaria -->
                <div class="col s6">
                    <mat-form-field>
                        <mat-label>Zona horaria</mat-label>
                        <mat-select>
                            <mat-option></mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <!-- Descripción -->
                <div class="col s12">
                    <mat-form-field>
                        <mat-label>Descripción</mat-label>
                        <textarea matInput name="descripcion" id="descripcion" cols="30" rows="10" placeholder="Opcional"></textarea>
                    </mat-form-field>
                </div>


                <!-- Avatar -->
                <div class="col s12">
                    <mat-form-field>
                        <mat-label matTooltip="Imagen o logo de tu agente" [matTooltipPosition]="'above'">Avatar</mat-label>
                        <input name="avatar" id="avatar" matInput placeholder="https://...">
                    </mat-form-field>
                </div>




            </div>

        </form>
    </mat-card-content>
    <mat-card-actions>
        <button mat-raised-button color="accent">Crear</button>

    </mat-card-actions>
</mat-card>
