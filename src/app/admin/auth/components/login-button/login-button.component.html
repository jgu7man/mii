<div *ngIf="this.isLoggedIn; else login">
    <button mat-raised-button (click)="_auth.singOut()">Cerrar Sesión</button>
</div>
<ng-template #login>
    <button mat-raised-button (click)="openDialog()">Ingresar</button>
    <button mat-raised-button (click)="createProject()">Crear proyecto</button>
</ng-template>
